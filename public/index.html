<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <style>
        /* Sleek, Modern, Center-Focused Responsive Layout styling */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; }
        .chat-container { width: 100%; max-width: 500px; height: 100%; max-height: 750px; background: #ffffff; display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-radius: 16px; overflow: hidden; margin: 10px; }
        header { background: #007bff; color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        header h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .status-text { font-size: 13px; font-weight: 500; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; transition: all 0.3s ease; }
        .status-text.online { background: #2ecc71; color: white; font-weight: 600; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        .chat-box { flex: 1; padding: 20px; background: #fdfdfd; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .message { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 15px; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .my-message { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .stranger-message { background: #f1f3f4; color: #1c1e21; align-self: flex-start; border-bottom-left-radius: 4px; }
        .system-message { background: #fff3cd; color: #856404; font-size: 13px; font-weight: 500; text-align: center; align-self: center; padding: 8px 16px; border-radius: 30px; max-width: 90%; border: 1px solid #ffeeba; margin: 5px 0; }
        .controls { padding: 15px; display: flex; gap: 10px; background: #ffffff; border-top: 1px solid #f0f2f5; align-items: center; }
        input[type="text"] { flex: 1; padding: 14px 18px; border: 1px solid #e4e6eb; border-radius: 24px; outline: none; font-size: 15px; background: #f0f2f5; transition: all 0.2s ease; }
        input[type="text"]:focus { background: #ffffff; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.15); }
        .btn { padding: 12px 24px; border: none; border-radius: 24px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: #007bff; color: white; padding: 12px 20px; }
        .send-btn:hover { background: #0056b3; }
        .action-container { display: flex; gap: 12px; padding: 0 15px 15px 15px; background: #ffffff; }
        .start-btn { background: #2ecc71; color: white; }
        .start-btn:hover { background: #27ae60; }
        .stop-btn { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .stop-btn:hover { background: #f5c6cb; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        @media (max-width: 480px) { .chat-container { margin: 0; height: 100%; max-height: 100%; border-radius: 0; } }
    </style>
    <script src="https://ably.com"></script>
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>AnimoChat Clone</h2>
            <div id="status" class="status-text">Disconnected</div>
        </header>
        <div id="chat-box" class="chat-box">
            <div class="system-message">Welcome! Click "Find Match" to start chatting with a stranger.</div>
        </div>
        <div class="controls">
            <input type="text" id="message-input" placeholder="Type a message..." disabled>
            <button id="send-btn" class="btn send-btn" disabled>Send</button>
        </div>
        <div class="action-container">
            <button id="match-btn" class="btn start-btn" style="flex: 1;">Find Match</button>
            <button id="leave-btn" class="btn stop-btn" style="flex: 1;" disabled>Leave Chat</button>
        </div>
    </div>

    <script>
        let ably, matchChannel, chatChannel;
        let myId = 'user_' + Math.random().toString(36).substring(2, 11);
        let currentRoom = null;

        const matchBtn = document.getElementById('match-btn');
        const leaveBtn = document.getElementById('leave-btn');
        const sendBtn = document.getElementById('send-btn');
        const messageInput = document.getElementById('message-input');
        const chatBox = document.getElementById('chat-box');
        const statusText = document.getElementById('status');

        async function init() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (!data.apiKey) {
                    appendMessage("Config Error: Add ABLY_API_KEY environment variable inside Vercel Settings.", "system-message");
                    return;
                }
                ably = new Ably.Realtime({ key: data.apiKey, clientId: myId });
                
                ably.connection.on('connected', () => {
                    statusText.innerText = "Ready";
                    // Listen for automatic invitations globally
                    matchChannel = ably.channels.get('matchmaking-pool');
                    matchChannel.subscribe('presence-match', (msg) => {
                        if (msg.data.target === myId) {
                            joinChatRoom(msg.data.room);
                        }
                    });
                });
            } catch (err) {
                appendMessage("Failed to initiate networking channel.", "system-message");
            }
        }

        matchBtn.addEventListener('click', () => {
            matchBtn.disabled = true;
            matchBtn.innerText = "Searching...";
            statusText.innerText = "Searching...";
            chatBox.innerHTML = '<div class="system-message">Searching for an available user online...</div>';
            
            // Enter pool presence state
            matchChannel.presence.enter({ searching: true }, () => {
                // Fetch complete present user list array mapping
                matchChannel.presence.get((err, members) => {
                    if (err) return;
                    
                    // FIXED: Read target properties directly out of standard member object container mapping
                    const strangers = members.filter(m => m.clientId !== myId);
                    
                    if (strangers.length > 0) {
                        // FIXED: Correct extraction of data fields down to index structure
                        const partnerId = strangers[0].clientId;
                        const generatedRoom = myId < partnerId ? `room_${myId}_${partnerId}` : `room_${partnerId}_${myId}`;
                        
                        // Fire signaling events to bind users cleanly
                        matchChannel.publish('presence-match', { target: partnerId, room: generatedRoom });
                        matchChannel.publish('presence-match', { target: myId, room: generatedRoom });
                    }
                });
            });
        });

        function joinChatRoom(roomName) {
            if (currentRoom) return; 
            
            currentRoom = roomName;
            matchChannel.presence.leave();
            chatChannel = ably.channels.get(currentRoom);
            
            statusText.innerText = "Connected";
            statusText.className = "status-text online";
            chatBox.innerHTML = '<div class="system-message">Connected! Say hello to the random stranger.</div>';
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            leaveBtn.disabled = false;
            matchBtn.disabled = true;

            chatChannel.subscribe('msg', (msg) => {
                if (msg.clientId !== myId) {
                    appendMessage("Stranger: " + msg.data, "stranger-message");
                }
            });

            chatChannel.subscribe('leave', () => {
                appendMessage("Stranger left the chat.", "system-message");
                resetUI();
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !chatChannel) return;
            chatChannel.publish('msg', text);
            appendMessage("You: " + text, "my-message");
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        leaveBtn.addEventListener('click', () => {
            if (chatChannel) {
                chatChannel.publish('leave', {});
                chatChannel.unsubscribe();
            }
            appendMessage("You left the chat.", "system-message");
            resetUI();
        });

        function resetUI() {
            currentRoom = null;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            leaveBtn.disabled = true;
            matchBtn.disabled = false;
            matchBtn.innerText = "Find Match";
            statusText.innerText = "Disconnected";
            statusText.className = "status-text";
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
